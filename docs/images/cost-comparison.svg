<text x="488.4739813148618" y="416" font-size="12" fill="#7B8794" text-anchor="middle">$2k</text>
<line x1="604.9479626297236" y1="104" x2="604.9479626297236" y2="398" stroke="#EEF0F2" stroke-width="1"/>
<text x="604.9479626297236" y="416" font-size="12" fill="#7B8794" text-anchor="middle">$4k</text>
<line x1="721.4219439445855" y1="104" x2="721.4219439445855" y2="398" stroke="#EEF0F2" stroke-width="1"/>
<text x="721.4219439445855" y="416" font-size="12" fill="#7B8794" text-anchor="middle">$6k</text>
<g transform="translate(32,116)" stroke="#52606D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="52" height="30" rx="3"/><path d="M28 32v8M18 44h20"/><path d="M10 10l8 6 7-4 9 9" /></g>
<text x="102" y="132" font-size="15" font-weight="700" fill="#1F2933">Interactive flat panel</text>
<text x="102" y="152" font-size="13" fill="#52606D">Promethean ActivPanel 9 Pro, 75"</text>
<path d="M372 124h374a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-374z" fill="#8A96A3"/>
<text x="760" y="142" font-size="16" font-weight="700" fill="#1F2933">$6,491</text>
<text x="760" y="160" font-size="12" fill="#52606D">= 87 Mimikai classrooms</text>
<g transform="translate(32,190)" stroke="#52606D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="52" height="30" rx="3"/><path d="M28 32v8M18 44h20"/><path d="M10 10l8 6 7-4 9 9" /></g>
<text x="102" y="206" font-size="15" font-weight="700" fill="#1F2933">Interactive flat panel</text>
<text x="102" y="226" font-size="13" fill="#52606D">SMART Board MX275-V5, 75"</text>
<path d="M372 198h238.67354006951464a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-238.67354006951464z" fill="#8A96A3"/>
<text x="624.6735400695146" y="216" font-size="16" font-weight="700" fill="#1F2933">$4,167</text>
<text x="624.6735400695146" y="234" font-size="12" fill="#52606D">= 56 Mimikai classrooms</text>
<g transform="translate(32,264)" stroke="#52606D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="14" width="40" height="28" rx="2"/><path d="M38 4h16v6H38z"/><path d="M46 10l-6 6"/><path d="M40 7l-3 0" /><path d="M10 26h14M10 32h20"/></g>
<text x="102" y="280" font-size="15" font-weight="700" fill="#1F2933">Interactive projector</text>
<text x="102" y="300" font-size="13" fill="#52606D">Epson BrightLink 760Wi (lowest listed)</text>
<path d="M372 272h89.64508097714891a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-89.64508097714891z" fill="#8A96A3"/>
<text x="475.6450809771489" y="290" font-size="16" font-weight="700" fill="#1F2933">$1,608</text>
<text x="475.6450809771489" y="308" font-size="12" fill="#52606D">= 21 Mimikai classrooms</text>
<g transform="translate(32,338)" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="16" width="22" height="10" rx="3"/><path d="M24 21h5"/><rect x="36" y="2" width="14" height="22" rx="2"/><path d="M43 24v8M43 32l-7 12M43 32l7 12M43 32v12"/></g>
<text x="102" y="354" font-size="15" font-weight="700" fill="#1F2933">Mimikai</text>
<text x="102" y="374" font-size="13" fill="#52606D">Fire TV Stick + phone tripod</text>
<path d="M372 346h2a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-2z" fill="#D97706"/>
<text x="388" y="364" font-size="16" font-weight="700" fill="#1F2933">≈ $75</text>
<text x="388" y="382" font-size="12" fill="#52606D">about $2.50 per child in a class of 30</text>
<text x="32" y="448" font-size="12" fill="#7B8794">Mimikai uses the projector or TV the classroom already has and the teacher's own Android phone; the interactive projector replaces a projector.</text>
<text x="32" y="467" font-size="12" fill="#7B8794">Fire TV Stick: $59.99 list (Fire TV Stick 4K, 2026 launch price; often $29.99–$44.99 on sale) + a basic phone tripod (≈ $15).</text>
<text x="32" y="486" font-size="12" fill="#7B8794">Sources: CDW-G (Promethean, list $8,069), B&amp;H Photo (SMART), Jordan School District Epson price list Q3 2026 ($1,608–$2,101.50),</text>
<text x="32" y="505" font-size="12" fill="#7B8794">Notebookcheck (Fire TV Stick prices). Links in the README.</text>
</svg>