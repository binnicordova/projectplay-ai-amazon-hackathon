<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">What it costs to make a classroom wall interactive</title>
<desc id="d">Interactive flat panel, Promethean ActivPanel 9 Pro, 75": $6,491. Interactive flat panel, SMART Board MX275-V5, 75": $4,167. Interactive projector, Epson BrightLink 760Wi (lowest listed): $1,608. Mimikai, Fire TV Stick + phone tripod: $75.</desc>
<rect x="0.5" y="0.5" width="959" height="557" rx="16" fill="#FFFFFF" stroke="#E4E7EB"/>
<text x="32" y="48" font-size="24" font-weight="700" fill="#1F2933">What it costs to make a classroom wall interactive</text>
<text x="32" y="76" font-size="15" fill="#52606D">Price of one classroom setup, US dollars (checked 23 Oct 2026)</text>
<line x1="372" y1="104" x2="372" y2="398" stroke="#EEF0F2" stroke-width="1"/>
<text x="372" y="416" font-size="12" fill="#7B8794" text-anchor="middle">$0</text>
